name: Release apps (Android, iOS, Windows, macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check-app-parity.yml

  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            command: build:win
          - platform: macos
            arch: arm64
            runner: macos-14
            command: build:mac
          - platform: macos
            arch: x64
            runner: macos-14
            command: build:mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build installer
        working-directory: apps/desktop
        run: npm run ${{ matrix.command }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile
      - name: Compile release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Prepare APK
        working-directory: apps/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/adaption-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: apps/mobile/dist/*.apk

  ios:
    name: iOS IPA and simulator
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - name: Prebuild iOS and install pods
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Compile simulator application
        working-directory: apps/mobile
        run: |
          set -o pipefail
          xcodebuild -workspace ios/adaption.xcworkspace -scheme adaption \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath ios/build-simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > simulator-build.log 2>&1 || { tail -n 160 simulator-build.log; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          ditto -c -k --keepParent ios/build-simulator/Build/Products/Release-iphonesimulator/adaption.app "dist/adaption-${VERSION}-ios-simulator.zip"
      - name: Compile unsigned device IPA
        working-directory: apps/mobile
        run: |
          set -o pipefail
          xcodebuild -workspace ios/adaption.xcworkspace -scheme adaption \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build > device-build.log 2>&1 || { tail -n 160 device-build.log; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/Payload
          cp -R ios/build-device/Build/Products/Release-iphoneos/adaption.app dist/Payload/
          cd dist
          zip -qr "adaption-${VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          if-no-files-found: error
          path: |
            apps/mobile/dist/*.ipa
            apps/mobile/dist/*.zip
      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: apps/mobile/*-build.log

  publish:
    name: Publish GitHub Release
    needs: [verify, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          EXPO_VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          test "$VERSION" = "$DESKTOP_VERSION"
          test "$VERSION" = "$EXPO_VERSION"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Check files and create checksums
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.ipa' | wc -l)" -eq 1
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Upload and publish
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "adaption $RELEASE_TAG" \
              --notes-file docs/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --notes-file docs/release-notes.md
