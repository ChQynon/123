name: Build Desktop Apps (Windows, macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows — Electron Builder (EXE NSIS + Portable)
  # ============================================================
  build-windows:
    name: Build Windows (PC)
    runs-on: windows-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Windows
        working-directory: apps/desktop
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi

  # ============================================================
  # macOS — Electron Builder (DMG + ZIP)
  # ============================================================
  build-macos:
    name: Build macOS (Mac)
    runs-on: macos-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build macOS
        working-directory: apps/desktop
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip

  # ============================================================
  # Linux — Electron Builder (AppImage)
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Linux
        working-directory: apps/desktop
        run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: apps/desktop/dist/*.AppImage

  # ============================================================
  # Release — создание GitHub Release с данными и соцсетями
  # ============================================================
