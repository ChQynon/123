name: Build Mobile Apps (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: write

jobs:
  # ============================================================
  # Android — Прямая сборка APK через Gradle + Android SDK
  # ============================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organize APK
        run: |
          mkdir -p apps/mobile/dist
          find apps/mobile/android/app/build/outputs/apk -name "*release*.apk" -exec cp {} apps/mobile/dist/adaption-1.0.0.apk \;
          if [ ! -f apps/mobile/dist/adaption-1.0.0.apk ]; then
            find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} apps/mobile/dist/adaption-1.0.0.apk \;
          fi
          ls -la apps/mobile/dist/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/dist/adaption-1.0.0.apk

      - name: Attach APK to GitHub Release
        continue-on-error: true
        run: |
          gh release upload v1.0.0 apps/mobile/dist/adaption-1.0.0.apk --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # iOS — Сборка под iOS (Simulator .app + Unsigned .ipa)
  # ============================================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild iOS project with CocoaPods
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean
          cd ios && pod install && cd ..

      - name: Build iOS Simulator Package
        working-directory: apps/mobile
        run: |
          mkdir -p dist
          xcodebuild \
            -workspace ios/adaption.xcworkspace \
            -scheme adaption \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../apps/mobile/dist/adaption-1.0.0-ios-simulator.zip adaption.app
          cd ../../../../..
          ls -la apps/mobile/dist/

      - name: Build iOS Unsigned IPA (Sideloadable)
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace ios/adaption.xcworkspace \
            -scheme adaption \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build || true
          
          if [ -d "ios/build-device/Build/Products/Release-iphoneos/adaption.app" ]; then
            mkdir -p Payload
            cp -R ios/build-device/Build/Products/Release-iphoneos/adaption.app Payload/
            zip -r dist/adaption-1.0.0-unsigned.ipa Payload
            rm -rf Payload
            ls -la dist/
          fi

      - name: Upload iOS Simulator Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-package
          path: apps/mobile/dist/adaption-1.0.0-ios-simulator.zip

      - name: Upload iOS Unsigned IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: apps/mobile/dist/adaption-1.0.0-unsigned.ipa

      - name: Attach iOS Builds to GitHub Release
        continue-on-error: true
        run: |
          gh release upload v1.0.0 apps/mobile/dist/adaption-1.0.0-ios-simulator.zip apps/mobile/dist/adaption-1.0.0-unsigned.ipa --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Release Summary & Notifications
  # ============================================================
  release-summary:
    name: Finalize Mobile Release
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        run: |
          echo "Android status: ${{ needs.build-android.result }}"
          echo "iOS status: ${{ needs.build-ios.result }}"