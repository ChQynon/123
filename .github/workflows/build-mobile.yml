name: Build Mobile Apps (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # ============================================================
  # EAS Cloud Build — Сборка Android APK и iOS IPA
  # ============================================================
  build-mobile:
    name: Build Mobile App (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Check EXPO_TOKEN and Build
        working-directory: apps/mobile
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "============================================================================"
            echo "⚠️ ОШИБКА: Секрет EXPO_TOKEN не настроен в репозитории!"
            echo "Для облачной сборки Android APK и iOS IPA выполните 2 шага:"
            echo "1. Зайдите на https://expo.dev/settings/access-tokens и создайте токен."
            echo "2. Добавьте его в репозиторий: Settings -> Secrets and variables -> Actions -> EXPO_TOKEN."
            echo "============================================================================"
            exit 1
          fi

          PLATFORM="${{ github.event.inputs.platform }}"
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ]; then
            eas build --platform all --profile production --non-interactive
          else
            eas build --platform "$PLATFORM" --profile production --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
          EXPO_IOS_DIST_P12_PASSWORD: ${{ secrets.EXPO_IOS_DIST_P12_PASSWORD }}
          EXPO_IOS_PROVISIONING_PROFILE: ${{ secrets.EXPO_IOS_PROVISIONING_PROFILE }}