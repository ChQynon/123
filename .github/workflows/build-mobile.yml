name: Build Mobile Apps (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # ============================================================
  # Android — Прямая сборка APK через Gradle + Android SDK
  # ============================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Organize APK
        run: |
          mkdir -p apps/mobile/dist
          find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} apps/mobile/dist/adaption.apk \;
          ls -la apps/mobile/dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/dist/adaption.apk

  # ============================================================
  # iOS — Сборка под iOS (Simulator .app / EAS IPA)
  # ============================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event_name == 'push' || github.event.inputs.platform == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Build iOS Simulator Package
        working-directory: apps/mobile
        run: |
          mkdir -p dist
          xcodebuild -workspace ios/adaption.xcworkspace \
            -scheme adaption \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          # Архивируем .app для запуска на Mac в симуляторе
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../dist/adaption-ios-simulator.zip adaption.app
          ls -la ../../../../../dist/

      - name: EAS Build (if EXPO_TOKEN is provided)
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          npm install -g eas-cli
          eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_IOS_DIST_P12_PASSWORD: ${{ secrets.EXPO_IOS_DIST_P12_PASSWORD }}
          EXPO_IOS_PROVISIONING_PROFILE: ${{ secrets.EXPO_IOS_PROVISIONING_PROFILE }}

      - name: Upload iOS Simulator Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-package
          path: apps/mobile/dist/adaption-ios-simulator.zip

  # ============================================================
  # Release — Прикрепление файлов к GitHub Release
  # ============================================================
  release-mobile:
    name: Attach to GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Update GitHub Release with Mobile Files
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-apk/*.apk
            ios-simulator-package/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}